<form
  class="glass-panel flex flex-col"
  (ngSubmit)="save()"
  [attr.aria-busy]="saving()"
>
  <h2 mat-dialog-title class="!text-white">Update album art</h2>
  <mat-dialog-content class="!text-white/85">
    <label for="cover-url" class="block text-sm">Image URL</label>
    <input
      id="cover-url"
      class="mt-2 w-full rounded-md border border-white/25 bg-black/20 px-3 py-2"
      type="url"
      name="cover-url"
      placeholder="https://"
      [ngModel]="url()"
      (ngModelChange)="setUrl($event)"
      [disabled]="saving()"
      cdkFocusInitial
    />

    <div class="mt-4 border-t border-white/15 pt-4">
      <input
        #fileInput
        type="file"
        hidden
        [accept]="acceptedTypes"
        (change)="selectFile(fileInput)"
      />
      <div class="flex flex-wrap items-center gap-x-3 gap-y-2">
        <button
          mat-stroked-button
          type="button"
          aria-describedby="cover-file-help"
          [disabled]="saving()"
          (click)="fileInput.click()"
        >
          Choose image…
        </button>
        <span class="break-all text-sm" aria-live="polite">{{
          file()?.name
        }}</span>
      </div>
      <p id="cover-file-help" class="mt-2 text-sm text-white/65">
        JPEG or PNG, up to 10 MiB
      </p>
      @if (fileError()) {
        <p class="mt-2 text-sm text-red-300" role="alert">{{ fileError() }}</p>
      }
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button
      mat-stroked-button
      type="button"
      [disabled]="saving()"
      (click)="cancel()"
    >
      Cancel
    </button>
    <button mat-button type="submit" [disabled]="!canSave()">
      {{ saving() ? "Updating…" : "Update" }}
    </button>
  </mat-dialog-actions>
</form>
