<div class="dialog-root glass-panel flex flex-col" (mouseleave)="close()">
  <!-- Header -->
  <div class="dialog-header flex items-center justify-between gap-3 px-4">
    <span class="header-title">Media Server</span>
    <span class="header-count">{{filteredMediaServerList().length}}</span>
  </div>

  <!-- Server list -->
  <div class="dialog-list flex flex-col">
    @for (device of filteredMediaServerList(); track device.udn) {
      <div class="device-row flex items-center">
      <button type="button" class="device-item flex items-center gap-3 grow min-w-0"
        [class.selected]="deviceService.isMediaServerSelected(device.udn)"
        (click)="selectServer(device.udn)">
        <span class="device-icon flex items-center justify-center">
          @if (device.img?.length > 0) {
            <img class="device-img" src="{{device.img}}" alt="{{device.friendlyName}}">
          } @else {
            <span class="material-symbols-outlined device-fallback">dns</span>
          }
        </span>
        <span class="device-text flex flex-col min-w-0">
          <span class="device-name" title="{{device.friendlyName}}">{{device.friendlyName}}</span>
          @if (device.extendedApi) {
            <span class="device-sub">Extended API</span>
          }
        </span>
        <span class="material-symbols-outlined check-icon">check</span>
      </button>
      <button type="button" class="info-button" (click)="showInfo(device)"
        [attr.aria-label]="'Info about ' + device.friendlyName" title="device info">
        <span class="material-symbols-outlined">info</span>
      </button>
      </div>
    }
  </div>
</div>
