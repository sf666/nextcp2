<div class="dialog-root glass-panel flex flex-col">
  <!-- Header with track info -->
  <div class="dialog-header flex gap-3 p-4" (mouseenter)="closeAllDialogs()">
    <img src="{{selectedMusicItem.albumArtUrl}}" class="cover object-cover">
    <div class="flex flex-col justify-center albumAndTitle">
      <div class="title">{{selectedMusicItem.title}}</div>
      <div class="artist mt-1">{{selectedMusicItem.artistName}}</div>
      <star-rating class="mt-2 scale-90 origin-left" [currentSong]="selectedMusicItem"></star-rating>
    </div>
  </div>

  <!-- Menu items -->

  <div class="dialogItems flex flex-col py-1">
    @if (hasValidSongId()) {
      <div class="section-header px-4 py-2">
        Server side playlist actions
      </div>
      <button class="playlist-item flex items-center gap-3 px-4 py-2.5" (click)="openAddToPlaylistDialog($event)">
        <span class="item-icon material-symbols-outlined text-lg">playlist_add</span>
        <span>Add to playlist</span>
      </button>
    }
    @if (isParentPlaylist) {
      <button class="playlist-item flex items-center gap-3 px-4 py-2.5" (mouseover)="closeAllDialogs()" (click)="deleteFromPlaylist()">
        <span class="item-icon material-symbols-outlined text-lg">delete</span>
        <span>Delete from playlist</span>
      </button>
    }

    @if (hasValidSongId()) {
      <div class="divider my-1"></div>
      <div class="section-header px-4 py-2">
        Player playlist actions
      </div>
      <button class="playlist-item flex items-center gap-3 px-4 py-2.5" (mouseenter)="closeAllDialogs()" (click)="actionPlayNext()">
        <span class="item-icon material-symbols-outlined text-lg">skip_next</span>
        <span>Play next</span>
      </button>
      <button class="playlist-item flex items-center gap-3 px-4 py-2.5" (mouseenter)="closeAllDialogs()" (click)="actionPlayLast()">
        <span class="item-icon material-symbols-outlined text-lg">add_to_queue</span>
        <span>Add to queue</span>
      </button>

      <div class="divider my-1"></div>
      <div class="section-header px-4 py-2">
        Other server actions
      </div>
      <button class="playlist-item flex items-center gap-3 px-4 py-2.5" (mouseover)="closeAllDialogs()" (click)="download()">
        <span class="item-icon material-symbols-outlined text-lg">download</span>
        <span>Download</span>
      </button>
      <button class="playlist-item flex items-center gap-3 px-4 py-2.5" (mouseover)="closeAllDialogs()" (click)="updateAlbumArt()">
        <span class="item-icon material-symbols-outlined text-lg">image</span>
        <span>Update album art</span>
      </button>
    }

    @if (isWebRadio()) {
      <div class="divider my-1"></div>
      <div class="section-header px-4 py-2">
        Live title of this station
      </div>
      <button class="playlist-item flex items-center gap-3 px-4 py-2.5" (mouseover)="closeAllDialogs()" (click)="setIcyOrder('auto')">
        <span class="item-icon material-symbols-outlined text-lg">{{ icyOrder() === 'auto' ? 'radio_button_checked' : 'radio_button_unchecked' }}</span>
        <span>Detect automatically</span>
      </button>
      <button class="playlist-item flex items-center gap-3 px-4 py-2.5" (mouseover)="closeAllDialogs()" (click)="setIcyOrder('artist-first')">
        <span class="item-icon material-symbols-outlined text-lg">{{ icyOrder() === 'artist-first' ? 'radio_button_checked' : 'radio_button_unchecked' }}</span>
        <span>Artist &ndash; Title</span>
      </button>
      <button class="playlist-item flex items-center gap-3 px-4 py-2.5" (mouseover)="closeAllDialogs()" (click)="setIcyOrder('title-first')">
        <span class="item-icon material-symbols-outlined text-lg">{{ icyOrder() === 'title-first' ? 'radio_button_checked' : 'radio_button_unchecked' }}</span>
        <span>Title &ndash; Station</span>
      </button>
    }
  </div>
</div>
